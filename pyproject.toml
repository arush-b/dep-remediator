[project]
name = "remediator"
version = "0.0.1"
description = "Finds vulnerable dependencies, upgrades them, fixes what breaks, and proves the result."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-sdk>=1.25",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
remediator = "remediator.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.370",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remediator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Exercise tests fail until you complete the exercise, so they only run when
# asked for: uv run pytest -m exercise
addopts = '-m "not exercise"'
markers = [
    "docker: needs a running Docker daemon",
    "exercise: learning exercise, run with -m exercise",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
